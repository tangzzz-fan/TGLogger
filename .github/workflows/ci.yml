name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve Swift package dependencies
        run: swift package resolve

      - name: Build package
        run: swift build

      - name: Run test suite
        run: swift test
