name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Guard hand-written docs are tracked
        run: |
          missing=$(comm -13 <(git ls-files docs | sort) <(find docs -type f 2>/dev/null | sort))
          if [ -n "$missing" ]; then
            echo "::error::以下 docs/ 文件在磁盘上存在，但没有被 git 跟踪（检查 .gitignore 是否吞掉了它们）:"
            echo "$missing"
            exit 1
          fi

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve Swift package dependencies
        run: swift package resolve

      - name: Build package
        run: swift build

      - name: Run test suite
        run: swift test
